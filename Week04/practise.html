<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Object-oriented JavaScript example</title>
</head>

<body>
    <p>This example requires you to enter commands in your browser's JavaScript console (see <a
            href="https://developer.mozilla.org/en-US/docs/Learn/Common_questions/What_are_browser_developer_tools">What
            are browser developer tools</a> for more information).</p>

    <script>
        const person = {
            name: ["Bob", "Smith"],
            age: 32,
            bio: function () {
                console.log(`${this.name[0]} ${this.name[1]} is ${this.age} years old.`);
            },
            introduceSelf: function () {
                console.log(`Hi! I'm ${this.name[0]}.`);
            },
        };
        const myDataName = "height";
        const myDataValue = "1.75m";
        person[myDataName] = myDataValue;

        
        // A constructor is just a function called using the new keyword. When you call a constructor, it will:
        function Person(name) {
            this.name = name;
            this.introduceSelf = function () {
                console.log(`Hi! I'm ${this.name}.`);
            };
        }
        const salva = new Person("Salva");
        salva.introduceSelf();
        // "Hi! I'm Salva."

        const frankie = new Person("Frankie");
        frankie.introduceSelf();


        // "Hi! I'm Frankie."
        //const person = {
        //name: {
        //     first: "Bob",
        //   last: "Smith",       dot notation
        // },
        // …
        //};
        // person["age"];
        // person["name"]["first"]; bracket notation

        function logProperty(propertyName) {
            console.log(person[propertyName]);
        }

        logProperty("name");
        // ["Bob", "Smith"]
        logProperty("age");
        // 32
        // person.age = 45;
        // person["name"]["last"] = "Cratchit";

        // person["eyes"] = "hazel";
        // person.farewell = function () {
        //     console.log("Bye everybody!");           inserting and testing new variables
        // };
        // person["eyes"];
        // person.farewell();
        // "Bye everybody!"

    </script>

</body>

</html>
