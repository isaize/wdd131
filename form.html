<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="Product Review Form: Share your thoughts about our products using this form.">
    <meta name="author" content="Innocent Saize">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Lora:wght@400;600&family=Roboto:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review Form</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="productName">Product Name:</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a product</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>
                <div class="star-rating">
                    <input type="radio" name="stars" id="star-a" value="5" required>
                    <label for="star-a">5 Stars</label>

                    <input type="radio" name="stars" id="star-b" value="4">
                    <label for="star-b">4 Stars</label>

                    <input type="radio" name="stars" id="star-c" value="3">
                    <label for="star-c">3 Stars</label>

                    <input type="radio" name="stars" id="star-d" value="2">
                    <label for="star-d">2 Stars</label>

                    <input type="radio" name="stars" id="star-e" value="1">
                    <label for="star-e">1 Star</label>
                </div>
            </fieldset>

            <label for="installDate">Install Date:</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Useful Features</legend>
                <div>
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    <label for="durability">Durability</label>
                </div>
                <div>
                    <input type="checkbox" id="ease-of-use" name="features" value="Ease of Use">
                    <label for="ease-of-use">Ease of Use</label>
                </div>
                <div>
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    <label for="performance">Performance</label>
                </div>
                <div>
                    <input type="checkbox" id="design" name="features" value="Design">
                    <label for="design">Design</label>
                </div>
            </fieldset>

            <label for="review">Review (Optional):</label>
            <textarea id="review" name="review" rows="4"></textarea>

            <label for="userName">User Name (Optional):</label>
            <input type="text" id="userName" name="userName">

            <input type="submit" id="submit" value="Submit Review">
        </form>

    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> Innocent Saize.🌹Zimbabwe</p>
        <p id="last-modified"></p>
    </footer>

</body>
</html>
